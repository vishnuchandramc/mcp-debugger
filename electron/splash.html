<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flow</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #09090b;
      color: #fafafa;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .icon-container {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .spinner {
      margin-top: 32px;
      width: 24px;
      height: 24px;
      border: 3px solid #27272a;
      border-top-color: #d4d4d8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="fade-in" style="display: flex; flex-direction: column; align-items: center;">
    <div class="icon-container">
      <img src="../assets/icon.png" alt="Flow" />
    </div>
    <h1>Flow</h1>
    <div class="spinner"></div>
  </div>
</body>
</html>
